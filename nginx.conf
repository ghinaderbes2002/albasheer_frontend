server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Friendly defaults
    server_tokens off;
    charset utf-8;
    client_max_body_size 10m;   # uploads (e.g. payment receipts)

    # ── gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ── Static assets are content-hashed by Vite ─────────────────────
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Common static files — short cache ────────────────────────────
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── HTML shell must always be revalidated ────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # ── SPA fallback — let React Router handle deep links ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Light security headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
