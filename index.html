<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo_al_basheer-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F2E6" />
    <meta name="description" content="البشير لتجارة الأدوات المنزلية — Al Basheer Home Appliances Trading" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="http://152.239.112.38" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Preload hero image — critical for LCP -->
    <link rel="preload" as="image" href="/images/al_basheer.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logo_al_basheer-removebg-preview.png" />

    <!-- Non-blocking font load -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=optional"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=optional"
      />
    </noscript>

    <title>البشير | Al Basheer</title>
  </head>
  <body>
    <!-- Static LCP shell — visible before JS loads, replaced by React -->
    <div id="root">
      <div style="position:relative;overflow:hidden;min-height:420px;background:#0d0d0f">
        <img
          src="/images/al_basheer.jpg"
          alt=""
          fetchpriority="high"
          decoding="sync"
          width="1200"
          height="600"
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(4px);transform:scale(1.05)"
        />
        <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5)"></div>
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;padding:2rem 1rem;text-align:center">
          <img
            src="/images/logo_al_basheer-removebg-preview.png"
            alt="البشير"
            fetchpriority="high"
            width="96"
            height="96"
            style="width:96px;height:96px;object-fit:contain"
          />
          <h1 style="color:#fff;font-family:Cairo,sans-serif;font-size:clamp(1.75rem,5vw,3.5rem);font-weight:800;margin:1rem 0 0.5rem;line-height:1.2">البشير لتجارة الأدوات المنزلية</h1>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
